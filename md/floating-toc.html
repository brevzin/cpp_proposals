<style>
/* Floating table of contents. On wide viewports, the static "Contents"
   block becomes a fixed sidebar on the right, scrollspy-highlighted and
   unfolded along the path to the current section (see the script below).
   On narrow viewports it becomes a fixed title bar and modal outline. */
:root {
  --floating-toc-width: 19rem;
  --floating-toc-right: clamp(1rem, 2vw, 2.5rem);
  --floating-toc-accent: #2878b5;
  --floating-toc-active: #eaf4fb;
  --floating-toc-border: #d9e1e7;
  --floating-toc-muted: #66727d;
  --floating-toc-rail: #dfe6eb;
  --floating-toc-surface: rgba(255, 255, 255, 0.96);
}

#TOC .toc-progress {
  display: none;
}

.toc-mobile-bar,
.toc-dialog,
.toc-expand-toggle {
  display: none;
}

/* Compact navigation for laptops, tablets, and phones. It is enabled only
   after the script has built the dialog, leaving the static TOC as a no-JS
   fallback. */
@media screen and (max-width: 84.999em) {
  html {
    scroll-behavior: smooth;
  }

  body.toc-menu-ready #TOC {
    display: none;
  }

  body.toc-menu-ready :is(h1, h2, h3, h4, h5, h6)[id] {
    scroll-margin-top: 4.5rem;
  }

  body.toc-menu-open {
    overflow: hidden;
  }

  body.toc-menu-ready .view-controls {
    top: 4.25rem;
  }

  .toc-mobile-bar {
    position: fixed;
    inset: 0 0 auto;
    z-index: 1100;
    display: flex;
    align-items: center;
    gap: 1rem;
    height: 3.5rem;
    box-sizing: border-box;
    padding:
      0.5rem max(1rem, env(safe-area-inset-right))
      0.5rem max(1rem, env(safe-area-inset-left));
    border-bottom: 1px solid var(--floating-toc-border);
    background: var(--floating-toc-surface);
    box-shadow: 0 0.25rem 1rem rgba(30, 55, 75, 0.08);
    backdrop-filter: blur(0.85rem);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  .toc-mobile-title {
    min-width: 0;
    flex: 1;
    overflow: hidden;
    color: #354651;
    font-size: 0.9rem;
    font-weight: 600;
    line-height: 1.2;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .toc-mobile-trigger {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    flex: 0 0 auto;
    padding: 0.45rem 0.65rem;
    border: 1px solid var(--floating-toc-border);
    border-radius: 0.6rem;
    background: transparent;
    color: #354651;
    font: 600 0.78rem/1 ui-sans-serif, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
    cursor: pointer;
  }

  .toc-mobile-trigger:hover {
    border-color: #bdc9d2;
    background: #f2f6f8;
  }

  .toc-mobile-trigger:focus-visible,
  .toc-dialog-close:focus-visible,
  .toc-dialog a:focus-visible {
    outline: 2px solid var(--floating-toc-accent);
    outline-offset: 2px;
  }

  .toc-menu-icon {
    position: relative;
    width: 1rem;
    height: 0.7rem;
    flex: 0 0 auto;
    border-top: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    box-sizing: border-box;
  }

  .toc-menu-icon::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    border-top: 2px solid currentColor;
    transform: translateY(-50%);
  }

  .toc-dialog[open] {
    position: fixed;
    inset: 0;
    z-index: 1200;
    display: flex;
    flex-direction: column;
    width: min(32rem, calc(100vw - 2rem));
    max-width: none;
    max-height: min(46rem, calc(100dvh - 2rem));
    box-sizing: border-box;
    margin: auto;
    padding: 0;
    overflow: hidden;
    border: 1px solid var(--floating-toc-border);
    border-radius: 1rem;
    background: var(--floating-toc-surface);
    color: var(--floating-toc-muted);
    box-shadow: 0 1.5rem 5rem rgba(20, 35, 45, 0.28);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
    text-align: left;
    hyphens: none;
  }

  .toc-dialog::backdrop {
    background: rgba(20, 30, 38, 0.45);
    backdrop-filter: blur(0.15rem);
  }

  .toc-dialog-header {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    padding: 1rem 1rem 0.9rem 1.15rem;
    border-bottom: 1px solid var(--floating-toc-border);
  }

  .toc-dialog-heading {
    min-width: 0;
    flex: 1;
  }

  .toc-dialog-eyebrow {
    margin: 0 0 0.3rem;
    color: var(--floating-toc-accent);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.11em;
    line-height: 1;
    text-transform: uppercase;
  }

  .toc-dialog-title {
    margin: 0;
    overflow: hidden;
    color: #354651;
    font-size: 1rem;
    font-weight: 650;
    line-height: 1.25;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .toc-dialog-close {
    display: grid;
    width: 2rem;
    height: 2rem;
    flex: 0 0 auto;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--floating-toc-muted);
    font: 400 1.5rem/1 sans-serif;
    cursor: pointer;
  }

  .toc-dialog-close:hover {
    background: #f2f6f8;
    color: #354651;
  }

  .toc-dialog-nav {
    min-height: 0;
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 0.75rem 0.8rem 1rem;
    scrollbar-width: thin;
    scrollbar-color: #b8c3cc transparent;
  }

  .toc-dialog ul {
    padding-left: 0;
    margin: 0;
    list-style: none;
  }

  .toc-dialog ul ul {
    position: relative;
    padding-left: 0.9rem;
    margin: 0.15rem 0 0.25rem 0.65rem;
  }

  .toc-dialog ul ul::before {
    content: "";
    position: absolute;
    top: 0.2rem;
    bottom: 0.2rem;
    left: 0;
    width: 1px;
    background: var(--floating-toc-rail);
  }

  .toc-dialog li,
  .toc-dialog li > ul {
    display: block;
    margin-top: 0;
    margin-bottom: 0;
  }

  .toc-dialog li::before {
    display: none;
  }

  .toc-dialog a {
    display: block;
    margin: 0.0625rem 0;
    padding: 0.38rem 0.55rem 0.38rem 0.65rem;
    border-left: 2px solid transparent;
    border-radius: 0 0.45rem 0.45rem 0;
    color: var(--floating-toc-muted);
    font-size: 0.875rem;
    line-height: 1.35;
    text-decoration: none;
    overflow-wrap: anywhere;
  }

  .toc-dialog a:hover {
    color: #244d6b;
    background: #f2f6f8;
  }

  .toc-dialog a.active {
    border-left-color: var(--floating-toc-accent);
    background: var(--floating-toc-active);
    color: #175f91;
    font-weight: 600;
  }

  .toc-dialog .toc-section-number {
    color: #89949d;
    font-variant-numeric: tabular-nums;
  }

  .toc-dialog code,
  .toc-dialog code span {
    color: inherit !important;
    background: transparent !important;
    font-size: 0.96em;
    font-weight: inherit;
  }
}

@media screen and (max-width: 30em) {
  body.toc-menu-ready {
    padding-top: 3.25rem;
  }

  .toc-mobile-trigger-label {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .toc-mobile-trigger {
    padding-inline: 0.6rem;
  }

  .toc-dialog[open] {
    width: calc(100vw - 1rem);
    max-height: calc(100dvh - 1rem);
    border-radius: 0.875rem;
  }
}

@media (prefers-color-scheme: dark) {
  :root {
    --floating-toc-accent: #62b0eb;
    --floating-toc-active: rgba(70, 145, 200, 0.16);
    --floating-toc-border: #3b454e;
    --floating-toc-muted: #abb5bd;
    --floating-toc-rail: #414b54;
    --floating-toc-surface: rgba(28, 28, 28, 0.96);
  }
}

@media screen and (max-width: 84.999em) and (prefers-color-scheme: dark) {
  .toc-mobile-title,
  .toc-mobile-trigger,
  .toc-dialog-title {
    color: #dce4e9;
  }

  .toc-mobile-trigger:hover,
  .toc-dialog-close:hover,
  .toc-dialog a:hover {
    background: rgba(255, 255, 255, 0.055);
  }

  .toc-dialog-close {
    color: #abb5bd;
  }

  .toc-dialog a:hover {
    color: #dceaf4;
  }

  .toc-dialog a.active {
    color: #84c7f5;
  }
}

@media screen and (max-width: 84.999em) and (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
}

@media (min-width: 85em) {

  html {
    scroll-behavior: smooth;
  }

  /* Shift the main column left to make room for the sidebar. */
  body:has(#TOC),
  body.has-toc {
    margin-right: calc(
      var(--floating-toc-right) + var(--floating-toc-width) + 2rem
    );
  }

  /* Park the view-controls pill at the top of the sidebar area,
     above the table of contents, aligned to its left edge. */
  body:has(#TOC) .view-controls,
  body.has-toc .view-controls {
    position: fixed;
    top: 1rem;
    right: calc(var(--floating-toc-right) + var(--floating-toc-width));
    transform: translateX(100%);
    margin: 0;
    border-color: var(--floating-toc-border);
    border-radius: 0.75rem;
    box-shadow: 0 0.35rem 1.25rem rgba(30, 55, 75, 0.09);
  }

  #TOC {
    position: fixed;
    top: 6.25rem;
    right: var(--floating-toc-right);
    width: var(--floating-toc-width);
    max-height: calc(100vh - 7.75rem);
    box-sizing: border-box;
    overflow-y: auto;
    overscroll-behavior: contain;
    border: 1px solid var(--floating-toc-border);
    border-radius: 0.875rem;
    background: var(--floating-toc-surface);
    box-shadow:
      0 0.75rem 2.25rem rgba(30, 55, 75, 0.08),
      0 0.125rem 0.4rem rgba(30, 55, 75, 0.05);
    scrollbar-width: thin;
    scrollbar-color: #b8c3cc transparent;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
    font-size: 0.825rem;
    line-height: 1.38;
    text-align: left;
    hyphens: none;
    color: var(--floating-toc-muted);
  }

  #TOC .toc-chrome {
    position: sticky;
    top: 0;
    z-index: 2;
    padding: 0.9rem 0.95rem 0.7rem;
    border-bottom: 1px solid var(--floating-toc-border);
    background: var(--floating-toc-surface);
    backdrop-filter: blur(0.75rem);
  }

  #TOC .toc-title-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  #TOC #toctitle {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    min-width: 0;
    flex: 1;
    font-size: 0.72rem;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: #4d5c68;
    border-bottom: none !important;
    margin: 0;
  }

  #TOC .toc-expand-toggle {
    display: inline-flex;
    min-width: 4.7rem;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    padding: 0.3rem 0.45rem;
    border: 1px solid var(--floating-toc-border);
    border-radius: 0.45rem;
    background: transparent;
    color: var(--floating-toc-muted);
    font: 600 0.68rem/1 ui-sans-serif, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
    cursor: pointer;
    transition:
      background-color 120ms ease,
      border-color 120ms ease,
      color 120ms ease;
  }

  #TOC .toc-expand-toggle:hover {
    border-color: #bdc9d2;
    background: #f2f6f8;
    color: #244d6b;
  }

  #TOC .toc-expand-toggle:focus-visible {
    outline: 2px solid var(--floating-toc-accent);
    outline-offset: 2px;
  }

  #TOC #toctitle::before {
    content: "";
    width: 0.45rem;
    height: 0.45rem;
    flex: 0 0 auto;
    border-radius: 50%;
    background: var(--floating-toc-accent);
    box-shadow: 0 0 0 0.2rem color-mix(in srgb,
      var(--floating-toc-accent) 14%, transparent);
  }

  #TOC .toc-progress {
    display: block;
    height: 0.1875rem;
    margin-top: 0.75rem;
    overflow: hidden;
    border-radius: 999px;
    background: var(--floating-toc-rail);
  }

  #TOC .toc-progress-bar {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background: var(--floating-toc-accent);
    transform: scaleX(0);
    transform-origin: left center;
  }

  #TOC > ul {
    padding: 0.65rem 0.75rem 0.8rem;
    margin: 0;
  }

  #TOC ul ul {
    position: relative;
    padding-left: 0.85rem;
    margin: 0.15rem 0 0.25rem 0.55rem;
  }

  #TOC ul ul::before {
    content: "";
    position: absolute;
    top: 0.15rem;
    bottom: 0.2rem;
    left: 0;
    width: 1px;
    background: var(--floating-toc-rail);
  }

  /* Fold up nested sections; the script unfolds the active path. */
  #TOC li > ul {
    display: none;
  }

  #TOC li.active-path > ul {
    display: block;
    animation: toc-reveal 120ms ease-out;
  }

  #TOC.toc-expanded li > ul {
    display: block;
  }

  #TOC li {
    margin: 0;
  }

  #TOC a {
    display: block;
    margin: 0.0625rem 0;
    padding: 0.3rem 0.55rem 0.3rem 0.6rem;
    border-left: 2px solid transparent;
    border-radius: 0 0.4rem 0.4rem 0;
    color: var(--floating-toc-muted);
    text-decoration: none;
    overflow-wrap: anywhere;
    transition:
      background-color 120ms ease,
      border-color 120ms ease,
      color 120ms ease;
  }

  #TOC a:hover {
    color: #244d6b;
    background: #f2f6f8;
  }

  #TOC a:focus-visible {
    outline: 2px solid var(--floating-toc-accent);
    outline-offset: 1px;
  }

  #TOC a.active {
    color: #175f91;
    border-left-color: var(--floating-toc-accent);
    background: var(--floating-toc-active);
    font-weight: 600;
  }

  #TOC .toc-section-number {
    color: #89949d;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    margin-right: 0.2em;
  }

  #TOC a.active .toc-section-number {
    color: inherit;
    opacity: 0.78;
  }

  /* Syntax highlighting is useful in the paper, but visually noisy in
     a compact navigation label. */
  #TOC code,
  #TOC code span {
    color: inherit !important;
    background: transparent !important;
    font-size: 0.96em;
    font-weight: inherit;
  }

  @keyframes toc-reveal {
    from {
      opacity: 0;
      transform: translateY(-0.15rem);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
}

@media (min-width: 85em) and (prefers-color-scheme: dark) {
  #TOC #toctitle {
    color: #d2d9de;
  }

  #TOC a:hover {
    color: #dceaf4;
    background: rgba(255, 255, 255, 0.055);
  }

  #TOC .toc-expand-toggle:hover {
    border-color: #59636c;
    background: rgba(255, 255, 255, 0.055);
    color: #dceaf4;
  }

  #TOC a.active {
    color: #84c7f5;
  }

  #TOC .toc-section-number {
    color: #7f8a93;
  }

  body:has(#TOC) .view-controls,
  body.has-toc .view-controls {
    border-color: var(--floating-toc-border);
    box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.28);
  }
}

@media (min-width: 85em) and (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  #TOC li.active-path > ul {
    animation: none;
  }

  #TOC a {
    transition: none;
  }

  #TOC .toc-expand-toggle {
    transition: none;
  }
}
</style>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const toc = document.getElementById('TOC');
  if (!toc) return;

  document.body.classList.add('has-toc');
  toc.setAttribute('aria-label', 'Table of contents');
  const sourceList = toc.querySelector(':scope > ul');
  if (sourceList && !sourceList.id) sourceList.id = 'toc-outline';

  // Keep the title and a small reading-progress indicator visible while
  // the outline itself scrolls.
  const title = toc.querySelector(':scope > #toctitle');
  const chrome = document.createElement('div');
  chrome.className = 'toc-chrome';
  const titleRow = document.createElement('div');
  titleRow.className = 'toc-title-row';
  if (title) titleRow.appendChild(title);

  const expandToggle = document.createElement('button');
  expandToggle.className = 'toc-expand-toggle';
  expandToggle.type = 'button';
  expandToggle.textContent = 'Show all';
  expandToggle.setAttribute('aria-expanded', 'false');
  expandToggle.setAttribute('aria-label', 'Show all table of contents sections');
  if (sourceList) expandToggle.setAttribute('aria-controls', sourceList.id);
  titleRow.appendChild(expandToggle);
  chrome.appendChild(titleRow);

  const progress = document.createElement('div');
  progress.className = 'toc-progress';
  progress.setAttribute('aria-hidden', 'true');
  const progressBar = document.createElement('span');
  progressBar.className = 'toc-progress-bar';
  progress.appendChild(progressBar);
  chrome.appendChild(progress);
  toc.prepend(chrome);

  const entries = Array.from(toc.querySelectorAll('a[href^="#"]'))
    .map(link => ({
      link,
      target: document.getElementById(
        decodeURIComponent(link.getAttribute('href')).slice(1))
    }))
    .filter(e => e.target);
  if (entries.length === 0) return;

  const sidebar = window.matchMedia('(min-width: 85em)');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let active = null;
  let mobileDialog = null;
  let mobileTrigger = null;
  let mobileLinks = [];

  expandToggle.addEventListener('click', () => {
    const expanded = toc.classList.toggle('toc-expanded');
    expandToggle.textContent = expanded ? 'Show less' : 'Show all';
    expandToggle.setAttribute('aria-expanded', String(expanded));
    expandToggle.setAttribute(
      'aria-label',
      expanded
        ? 'Show only the current table of contents path'
        : 'Show all table of contents sections'
    );
    if (active) {
      requestAnimationFrame(() => keepActiveEntryVisible(active.link));
    }
  });

  function syncMobileActive(scrollToActive = false) {
    const activeHref = active?.link.getAttribute('href');
    let mobileActive = null;

    for (const link of mobileLinks) {
      const isActive = link.getAttribute('href') === activeHref;
      link.classList.toggle('active', isActive);
      if (isActive) {
        link.setAttribute('aria-current', 'location');
        mobileActive = link;
      } else {
        link.removeAttribute('aria-current');
      }
    }

    if (scrollToActive && mobileActive) {
      requestAnimationFrame(() => {
        mobileActive.scrollIntoView({ block: 'center', behavior: 'auto' });
      });
    }
  }

  function markMobileDialogClosed() {
    document.body.classList.remove('toc-menu-open');
    if (mobileTrigger) mobileTrigger.setAttribute('aria-expanded', 'false');
  }

  function closeMobileDialog() {
    if (!mobileDialog?.open) return;
    if (typeof mobileDialog.close === 'function') {
      mobileDialog.close();
    } else {
      mobileDialog.removeAttribute('open');
      markMobileDialogClosed();
    }
  }

  // Build a compact title bar and a modal copy of the outline. IDs are
  // removed from the copy so the document retains a single canonical set.
  if (sourceList) {
    const paperTitle = (
      document.querySelector('#title-block-header .title')?.textContent ||
      document.title ||
      'C++ paper'
    ).trim().replace(/\s+/g, ' ');

    const mobileBar = document.createElement('header');
    mobileBar.className = 'toc-mobile-bar';

    const mobileTitle = document.createElement('div');
    mobileTitle.className = 'toc-mobile-title';
    mobileTitle.textContent = paperTitle;
    mobileTitle.title = paperTitle;

    mobileTrigger = document.createElement('button');
    mobileTrigger.className = 'toc-mobile-trigger';
    mobileTrigger.type = 'button';
    mobileTrigger.setAttribute('aria-label', 'Open table of contents');
    mobileTrigger.setAttribute('aria-expanded', 'false');
    mobileTrigger.setAttribute('aria-controls', 'toc-dialog');

    const menuIcon = document.createElement('span');
    menuIcon.className = 'toc-menu-icon';
    menuIcon.setAttribute('aria-hidden', 'true');
    const triggerLabel = document.createElement('span');
    triggerLabel.className = 'toc-mobile-trigger-label';
    triggerLabel.textContent = 'Contents';
    mobileTrigger.append(menuIcon, triggerLabel);
    mobileBar.append(mobileTitle, mobileTrigger);

    mobileDialog = document.createElement('dialog');
    mobileDialog.id = 'toc-dialog';
    mobileDialog.className = 'toc-dialog';
    mobileDialog.setAttribute('aria-modal', 'true');
    mobileDialog.setAttribute('aria-labelledby', 'toc-dialog-title');

    const dialogHeader = document.createElement('header');
    dialogHeader.className = 'toc-dialog-header';
    const dialogHeading = document.createElement('div');
    dialogHeading.className = 'toc-dialog-heading';
    const dialogEyebrow = document.createElement('div');
    dialogEyebrow.className = 'toc-dialog-eyebrow';
    dialogEyebrow.textContent = 'Contents';
    const dialogTitle = document.createElement('h2');
    dialogTitle.id = 'toc-dialog-title';
    dialogTitle.className = 'toc-dialog-title';
    dialogTitle.textContent = paperTitle;
    dialogTitle.title = paperTitle;
    dialogHeading.append(dialogEyebrow, dialogTitle);

    const closeButton = document.createElement('button');
    closeButton.className = 'toc-dialog-close';
    closeButton.type = 'button';
    closeButton.setAttribute('aria-label', 'Close table of contents');
    closeButton.textContent = '\u00d7';
    dialogHeader.append(dialogHeading, closeButton);

    const dialogNav = document.createElement('nav');
    dialogNav.className = 'toc-dialog-nav';
    dialogNav.setAttribute('aria-label', 'Table of contents');
    const mobileList = sourceList.cloneNode(true);
    mobileList.removeAttribute('id');
    for (const element of mobileList.querySelectorAll('[id]')) {
      element.removeAttribute('id');
    }
    for (const element of mobileList.querySelectorAll('.active, .active-path')) {
      element.classList.remove('active', 'active-path');
      element.removeAttribute('aria-current');
    }
    dialogNav.appendChild(mobileList);
    mobileDialog.append(dialogHeader, dialogNav);
    mobileLinks = Array.from(dialogNav.querySelectorAll('a[href^="#"]'));

    document.body.prepend(mobileBar);
    document.body.appendChild(mobileDialog);
    document.body.classList.add('toc-menu-ready');

    mobileTrigger.addEventListener('click', () => {
      syncMobileActive();
      document.body.classList.add('toc-menu-open');
      mobileTrigger.setAttribute('aria-expanded', 'true');
      if (typeof mobileDialog.showModal === 'function') {
        mobileDialog.showModal();
      } else {
        mobileDialog.setAttribute('open', '');
      }
      syncMobileActive(true);
    });
    closeButton.addEventListener('click', closeMobileDialog);
    mobileDialog.addEventListener('close', markMobileDialogClosed);
    mobileDialog.addEventListener('click', event => {
      if (event.target === mobileDialog) closeMobileDialog();
    });
    dialogNav.addEventListener('click', event => {
      if (event.target.closest('a[href^="#"]')) closeMobileDialog();
    });
  }

  function keepActiveEntryVisible(link) {
    if (!sidebar.matches) return;

    const tocRect = toc.getBoundingClientRect();
    const linkRect = link.getBoundingClientRect();
    const top = tocRect.top + chrome.offsetHeight + 8;
    const bottom = tocRect.bottom - 8;

    if (linkRect.top < top) {
      toc.scrollBy({
        top: linkRect.top - top,
        behavior: reduceMotion.matches ? 'auto' : 'smooth'
      });
    } else if (linkRect.bottom > bottom) {
      toc.scrollBy({
        top: linkRect.bottom - bottom,
        behavior: reduceMotion.matches ? 'auto' : 'smooth'
      });
    }
  }

  function update() {
    const scrollable = document.documentElement.scrollHeight - window.innerHeight;
    const fraction = scrollable > 0
      ? Math.max(0, Math.min(1, window.scrollY / scrollable))
      : 0;
    progressBar.style.transform = `scaleX(${fraction})`;

    // Current section: the last heading at or above the reading line.
    const threshold = Math.min(window.innerHeight * 0.25, 150);
    let current = entries[0];
    for (const e of entries) {
      // TOC entries are in document order, so stop at the first
      // heading below the reading line.
      if (e.target.getBoundingClientRect().top > threshold) break;
      current = e;
    }
    if (current === active) {
      if (active) keepActiveEntryVisible(active.link);
      return;
    }

    if (active) {
      active.link.classList.remove('active');
      active.link.removeAttribute('aria-current');
    }
    for (const li of toc.querySelectorAll('li.active-path')) {
      li.classList.remove('active-path');
    }

    active = current;
    if (active) {
      active.link.classList.add('active');
      active.link.setAttribute('aria-current', 'location');
      for (let n = active.link.parentElement; n && n !== toc; n = n.parentElement) {
        if (n.tagName === 'LI') n.classList.add('active-path');
      }
      keepActiveEntryVisible(active.link);
      syncMobileActive();
    }
  }

  let queued = false;
  function onScroll() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; update(); });
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });
  sidebar.addEventListener('change', () => {
    if (sidebar.matches) closeMobileDialog();
    update();
  });
  // Late layout shifts (images, MathJax, mermaid) move the headings.
  window.addEventListener('load', update);
  update();
});
</script>
